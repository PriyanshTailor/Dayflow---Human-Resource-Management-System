<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Dayflow</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #0f172a;
            --muted: #6b7280;
            --surface: #ffffff;
            --surface-soft: #f6f4fb;
            --surface-tint: #f3e8ff;
            --accent: #7c3aed;
            --accent-2: #9333ea;
            --success: #22c55e;
            --shadow: 0 14px 40px rgba(17, 24, 39, 0.12);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 18% 20%, rgba(124, 58, 237, 0.08), transparent 32%),
                        radial-gradient(circle at 76% 12%, rgba(147, 51, 234, 0.07), transparent 28%),
                        var(--surface-soft);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            height: 64px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            box-shadow: var(--shadow);
        }

        .navbar-brand,
        .nav-link {
            color: #ffffff !important;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .nav-link.active {
            color: #fef3c7 !important;
        }

        .dropdown-toggle::after { display: none !important; }

        /* Admin status dot */
        .admin-status {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.14);
            transition: background 200ms ease, box-shadow 200ms ease;
        }

        .admin-status.active {
            background: var(--success);
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18);
        }

        .status-toggle {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.12);
            cursor: pointer;
        }

        .status-menu {
            min-width: 240px;
            padding: 14px;
        }

        .status-menu h6 {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .status-menu .form-control {
            font-size: 13px;
            padding: 8px 10px;
        }

        .status-menu .btn {
            width: 100%;
        }

        /* Action bar */
        .top-actions {
            margin: 28px 0 14px;
            padding: 18px 22px;
            border: 1px solid #e5e7eb;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        /* Legend pills */
        .legend-pill {
            padding: 8px 12px;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid #e9d5ff;
            color: var(--ink);
            font-weight: 500;
            font-size: 13px;
        }
        .legend-pill span { display: inline-block; width: 12px; height: 12px; border-radius: 999px; margin-right: 8px; }

        /* Buttons */
        .btn-add-employee {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #ffffff;
            border: none;
            padding: 11px 18px;
            font-weight: 700;
            letter-spacing: 0.2px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.28);
        }
        .btn-add-employee:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 36px rgba(124, 58, 237, 0.36);
            color:#e8dee8;
        }

        .btn-ghost {
            background: var(--surface);
            border: 1px solid #e5e7eb;
            color: var(--ink);
            border-radius: 12px;
            padding: 10px 14px;
        }
        .btn-ghost:hover { border-color: var(--accent); }

        /* Search */
        .search-input {
            max-width: 560px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            color: var(--ink);
            border-radius: 12px;
        }

        .search-input:focus {
            border-color: rgba(124, 58, 237, 0.55);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        /* Employee Card */
        .employee-card {
            background: var(--surface);
            border-radius: 10px;
            padding: 22px;
            height: 240px;
            text-align: left;
            position: relative;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 1px solid #e5e7eb;
            transition: transform 200ms ease, box-shadow 200ms ease, border 200ms ease;
        }

        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(17, 24, 39, 0.16);
            border: 1px solid rgba(124, 58, 237, 0.35);
        }

        /* Employee Image */
        .employee-card img {
            width: 82px;
            height: 82px;
            border-radius: 10px;
            margin-bottom: 14px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
        }

        /* Employee Name */
        .employee-card h6 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--ink);
        }

        .employee-card small {
            color: var(--muted);
            letter-spacing: 0.3px;
        }

        /* Status Dot */
        .status-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }

        /* Status Colors */
        .present { background: #22c55e; }
        .absent  { background: #eab308; }
        .leave {
            background: linear-gradient(145deg, #38bdf8, #0ea5e9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>

<body>

<!-- Shared Navbar -->
<div id="admin-navbar"></div>

<!-- CONTENT -->
<div class="container-fluid px-4">

    <!-- ACTION BAR -->
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 top-actions">
        <div class="d-flex gap-2">
            <button class="btn btn-add-employee" onclick="addEmployee()">
                + Add New Employee
            </button>
            <button class="btn btn-ghost" onclick="refreshDashboard()">
                Refresh
            </button>
        </div>

        <input type="text"
               id="search"
               class="form-control search-input"
               placeholder="Search employee or ID"
               onkeyup="searchEmployee()">
    </div>

    <!-- LEGEND -->
    <div class="d-flex flex-wrap gap-2 mb-3">
        <div class="legend-pill"><span class="present"></span>Present</div>
        <div class="legend-pill"><span class="absent"></span>Absent</div>
        <div class="legend-pill"><span class="leave"></span>On Leave</div>
    </div>

    <!-- EMPLOYEE GRID -->
    <div class="row g-4" id="employeeGrid">

        <!-- Employee Card -->
        <div class="col-xl-3 col-lg-4 col-md-6 employee-item">
            <div class="employee-card" onclick="viewEmployee()">
                <span class="status-dot present"></span>
                <img src="../assets/download%20(1).jpg" alt="Employee avatar">
                <h6>John Doe</h6>
                <small class="text-muted">EMP101 · Product</small>
            </div>
        </div>

        <div class="col-xl-3 col-lg-4 col-md-6 employee-item">
            <div class="employee-card">
                <span class="status-dot absent"></span>
                <img src="../assets/download%20(2).jpg" alt="Employee avatar">
                <h6>Alice Smith</h6>
                <small class="text-muted">EMP102 · CX</small>
            </div>
        </div>

        <div class="col-xl-3 col-lg-4 col-md-6 employee-item">
            <div class="employee-card">
                <span class="status-dot leave"></span>
                <img src="../assets/download%20(7).jpg" alt="Employee avatar">
                <h6>Robert Lee</h6>
                <small class="text-muted">EMP103 · Design</small>
            </div>
        </div>

        <div class="col-xl-3 col-lg-4 col-md-6 employee-item">
            <div class="employee-card">
                <span class="status-dot present"></span>
                <img src="../assets/01.jpg" alt="Employee avatar">
                <h6>Priya Shah</h6>
                <small class="text-muted">EMP104 · HR</small>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function loadAdminNavbar() {
        var host = document.getElementById('admin-navbar');
        if (!host) return;
        fetch('navbar.html')
            .then(function (res) { return res.text(); })
            .then(function (html) { host.innerHTML = html; })
            .catch(function (err) { console.error('Failed to load navbar', err); });
    }

    document.addEventListener('DOMContentLoaded', loadAdminNavbar);

    /* View employee */
    function viewEmployee() {
        window.location.href = "employee-view.html";
    }

    /* Add employee */
    function addEmployee() {
        window.location.href = "add-employee.html";
    }

    /* Search validation */
    function searchEmployee() {
        var filter = document.getElementById("search").value.toLowerCase();
        var cards = document.getElementsByClassName("employee-item");

        for (var i = 0; i < cards.length; i++) {
            var text = cards[i].innerText.toLowerCase();
            cards[i].style.display = text.includes(filter) ? "" : "none";
        }
    }

    /* Refresh stub */
    function refreshDashboard() {
        var btn = document.querySelector('.btn-ghost');
        btn.textContent = 'Refreshing...';
        setTimeout(function () {
            btn.textContent = 'Refresh';
        }, 900);
    }
</script>

</body>
</html>
