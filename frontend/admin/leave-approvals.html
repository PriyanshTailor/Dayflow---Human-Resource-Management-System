<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Off | Dayflow</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --ink: #1e293b;
    --ink-light: #475569;
    --muted: #64748b;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --accent: #7c3aed;
    --accent-2: #9333ea;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
    --shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.12);
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.page-shell {
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
}

.page-card {
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: var(--shadow-lg);
    padding: 32px;
    transition: box-shadow 0.3s ease;
}

.page-card:hover {
    box-shadow: 0 25px 50px rgba(15, 23, 42, 0.15);
}

.muted { color: var(--muted); }

/* Header */
.header-section {
    background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
    padding: 24px 28px;
    border-radius: 16px;
    margin-bottom: 28px;
    border: 1px solid #e9d5ff;
    box-shadow: var(--shadow-sm);
}

.header-section h4 {
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: -0.02em;
}

.header-section p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
}

/* Action Bar */
.action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}

.btn-new {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    font-weight: 600;
    font-size: 14px;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    transition: all 0.2s ease;
    cursor: pointer;
}

.btn-new:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
    color: #ffffff;
}

.btn-new:active {
    transform: translateY(0);
}

.search-input {
    max-width: 360px;
    border-radius: 12px;
    border: 2px solid #e2e8f0;
    padding: 10px 16px;
    font-size: 14px;
    transition: all 0.2s ease;
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
}

.search-input::placeholder {
    color: #94a3b8;
}

/* Stats */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
}

.stat-card {
    background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
}

.stat-card h6 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
}

.stat-card .value {
    font-size: 36px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 8px;
}

.stat-card .label {
    font-size: 13px;
    color: var(--ink-light);
    font-weight: 500;
}

/* Table */
.table-responsive {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
}

table {
    font-size: 14px;
    margin: 0;
}

table thead th {
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 16px;
    border-bottom: 2px solid #e2e8f0;
}

table tbody tr {
    transition: all 0.2s ease;
    border-bottom: 1px solid #f1f5f9;
}

table tbody tr:hover {
    background: #fafafa;
}

table tbody td {
    vertical-align: middle;
    padding: 18px 16px;
    color: var(--ink-light);
}

table tbody td:first-child {
    font-weight: 600;
    color: var(--ink);
}

.status-badge {
    padding: 6px 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
}

.status-approved {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #a7f3d0;
}

.status-rejected {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
}

.btn-action {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-reject {
    background: #fee2e2;
    color: var(--danger);
    border: 1px solid #fecaca;
}

.btn-reject:hover {
    background: var(--danger);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
}

.btn-approve {
    background: #d1fae5;
    color: var(--success);
    border: 1px solid #a7f3d0;
}

.btn-approve:hover {
    background: var(--success);
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}

.empty-state svg {
    width: 80px;
    height: 80px;
    margin-bottom: 16px;
    opacity: 0.3;
}

/* Modal Backdrop Blur */
.modal-backdrop {
    backdrop-filter: blur(8px);
    background-color: rgba(15, 23, 42, 0.6) !important;
}

.modal-content {
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
}

.modal-header {
    background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
    border-bottom: 1px solid #e9d5ff;
    border-radius: 20px 20px 0 0;
    padding: 20px 24px;
}

.modal-header .modal-title {
    font-weight: 700;
    color: var(--ink);
    font-size: 20px;
}

.modal-header .btn-close {
    background: transparent;
    opacity: 0.6;
}

.modal-header .btn-close:hover {
    opacity: 1;
}

.modal-body {
    padding: 28px 24px;
}

.modal-footer {
    border-top: 1px solid #e2e8f0;
    padding: 16px 24px;
}

.form-label {
    font-weight: 600;
    color: var(--ink);
    font-size: 14px;
    margin-bottom: 8px;
}

.form-control,
.form-select {
    border-radius: 10px;
    border: 2px solid #e2e8f0;
    padding: 10px 14px;
    font-size: 14px;
    transition: all 0.2s ease;
}

.form-control:focus,
.form-select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
}

/* Responsive */
@media (max-width: 768px) {
    .page-shell {
        padding: 20px;
    }
    
    .page-card {
        padding: 20px;
    }
    
    .stats-row {
        grid-template-columns: 1fr;
    }
    
    .action-bar {
        flex-direction: column;
        align-items: stretch;
    }
    
    .search-input {
        max-width: 100%;
    }
    
    table {
        font-size: 13px;
    }
    
    table thead th,
    table tbody td {
        padding: 12px 8px;
    }
}
</style>
</head>

<body>

<div id="admin-navbar"></div>

<div class="page-shell">
<div class="page-card">

    <!-- Header
    <div class="header-section">
        <h4 class="mb-1 fw-bold">Time Off</h4>
        <p class="mb-0 muted">Allocation</p>
    </div> -->

    <!-- Action Bar -->
    <div class="action-bar">
        <button class="btn btn-new" data-bs-toggle="modal" data-bs-target="#newLeaveModal">+ NEW</button>
        <input type="text" id="searchInput" class="form-control search-input" placeholder="Searchbar" oninput="filterTable()">
    </div>

    <!-- Stats -->
    <div class="stats-row">
        <div class="stat-card">
            <h6>Sick Time Off</h6>
            <div class="value">26</div>
            <div class="label">Days Available</div>
        </div>
        <div class="stat-card">
            <h6>Casual Leave</h6>
            <div class="value">07</div>
            <div class="label">Days Available</div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-bordered align-middle mb-0" id="leaveTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Time off Type</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="leaveBody">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

</div>
</div>

<!-- New Leave Modal -->
<div class="modal fade" id="newLeaveModal" tabindex="-1" aria-labelledby="newLeaveModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newLeaveModalLabel">New Leave Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="leaveForm">
                    <div class="mb-3">
                        <label for="employeeName" class="form-label">Employee Name</label>
                        <input type="text" class="form-control" id="employeeName" placeholder="Enter name" required>
                    </div>
                    <div class="mb-3">
                        <label for="employeeId" class="form-label">Employee ID</label>
                        <input type="text" class="form-control" id="employeeId" placeholder="EMP###" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="startDate" class="form-label">Start Date</label>
                            <input type="date" class="form-control" id="startDate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="endDate" class="form-label">End Date</label>
                            <input type="date" class="form-control" id="endDate" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="leaveType" class="form-label">Time Off Type</label>
                        <select class="form-select" id="leaveType" required>
                            <option value="">Select type</option>
                            <option value="Paid Time Off">Paid Time Off</option>
                            <option value="Sick Leave">Sick Leave</option>
                            <option value="Casual Leave">Casual Leave</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="reason" class="form-label">Reason</label>
                        <textarea class="form-control" id="reason" rows="3" placeholder="Enter reason for leave"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-new" onclick="submitLeaveRequest()">Submit Request</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API_BASE = '/hrms/backend';

function loadAdminNavbar() {
    var host = document.getElementById('admin-navbar');
    if (!host) return;
    fetch('navbar.html')
        .then(res => res.text())
        .then(html => {
            host.innerHTML = html;
            host.querySelectorAll('script').forEach(oldScript => {
                const s = document.createElement('script');
                if (oldScript.src) {
                    s.src = oldScript.src;
                } else {
                    s.textContent = oldScript.textContent;
                }
                host.appendChild(s);
            });
        })
        .catch(err => console.error(err));
}

let leaveData = [];
let filteredData = [];

// Load leave requests from backend
async function loadLeaveData() {
    try {
        const response = await fetch(API_BASE + '/admin/leave-approvals.php', {
            credentials: 'include'
        });
        
        if (response.status === 401) {
            window.location.href = '/hrms/frontend/auth/login.html';
            return;
        }
        
        const data = await response.json();
        
        if (data.success) {
            // Normalize payload from backend (data.data) and status casing
            leaveData = (data.data || []).map(l => ({
                ...l,
                status: (l.status || 'Pending').toLowerCase()
            }));
            filteredData = [...leaveData];
            renderTable();
        }
    } catch (error) {
        console.error('Error loading leave data:', error);
    }
}

function renderTable() {
    const tbody = document.getElementById('leaveBody');
    tbody.innerHTML = '';

    if (!filteredData.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No records found</td></tr>';
        return;
    }

    filteredData.forEach(leave => {
        const statusClass = leave.status === 'approved' ? 'status-approved' :
                   leave.status === 'rejected' ? 'status-rejected' : 'status-pending';
        const statusText = leave.status.charAt(0).toUpperCase() + leave.status.slice(1);

        const actionButtons = leave.status === 'pending' ?
            `<button class="btn-action btn-reject me-2" onclick="rejectLeave(${leave.leave_id})" title="Reject">✕</button>
             <button class="btn-action btn-approve" onclick="approveLeave(${leave.leave_id})" title="Approve">✓</button>` :
            '<span class="text-muted">—</span>';

        tbody.innerHTML += `
            <tr>
                <td>
                    <div class="fw-bold">${leave.employee_name || 'N/A'}</div>
                    <div class="text-muted small">${leave.employee_id || 'N/A'}</div>
                </td>
                <td>${leave.start_date}</td>
                <td>${leave.end_date}</td>
                <td>${leave.leave_type}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td class="text-center">${actionButtons}</td>
            </tr>
        `;
    });
}

function filterTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    filteredData = leaveData.filter(leave => {
        const searchText = ((leave.employee_name || '') + ' ' + (leave.employee_id || '') + ' ' + leave.leave_type + ' ' + leave.status).toLowerCase();
        return searchText.includes(search);
    });
    renderTable();
}

async function approveLeave(leaveId) {
    try {
        const response = await fetch(API_BASE + '/admin/leave-approvals.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
                leave_id: leaveId,
                action: 'approve'
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            const leave = leaveData.find(l => l.leave_id === leaveId);
            if (leave) {
                alert(`✓ Approved leave for ${leave.employee_name}`);
            }
            loadLeaveData(); // Reload data
        } else {
            alert(data.message || 'Failed to approve leave');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to approve leave');
    }
}

async function rejectLeave(leaveId) {
    try {
        const response = await fetch(API_BASE + '/admin/leave-approvals.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({
                leave_id: leaveId,
                action: 'reject'
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            const leave = leaveData.find(l => l.leave_id === leaveId);
            if (leave) {
                alert(`✕ Rejected leave for ${leave.employee_name}`);
            }
            loadLeaveData(); // Reload data
        } else {
            alert(data.message || 'Failed to reject leave');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Failed to reject leave');
    }
}

function addNewLeave() {
    alert('Open "New Leave Request" form (to be implemented)');
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
    loadAdminNavbar();
    loadLeaveData();
});
</script>

</body>
</html>
