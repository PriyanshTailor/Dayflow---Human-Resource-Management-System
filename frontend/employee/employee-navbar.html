<div class="employee-navbar-wrapper">
  <nav class="navbar navbar-expand px-4 employee-navbar">
    <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
      <img src="../assets/logo.png" alt="Dayflow Logo" class="navbar-logo">
      <span class="fw-bold">Dayflow</span>
    </a>

    <ul class="navbar-nav ms-4">
      <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
      <li class="nav-item"><a class="nav-link" href="time-off.html">Time Off</a></li>
    </ul>

    <div class="ms-auto d-flex align-items-center gap-3">

      <!-- CHECK IN / OUT -->
      <div class="dropdown">
        <div id="empStatusToggle"
             class="status-toggle dropdown-toggle"
             data-bs-toggle="dropdown"
             title="Not Checked In">
          <div id="empStatus" class="emp-status"></div>
        </div>

        <div class="dropdown-menu dropdown-menu-end status-menu">
          <div id="empCheckInPanel">
            <h6 class="text-uppercase text-muted mb-2">Check In</h6>
            <input type="time" class="form-control mb-2" id="empCheckInTime">
            <button class="btn btn-primary btn-sm" id="empCheckInBtn">Check In</button>
          </div>

          <div id="empCheckOutPanel" class="d-none">
            <h6 class="text-uppercase text-muted mb-2">Check Out</h6>
            <input type="time" class="form-control mb-2" id="empCheckOutTime">
            <button class="btn btn-outline-primary btn-sm" id="empCheckOutBtn">Check Out</button>
          </div>
        </div>
      </div>

      <!-- AVATAR -->
      <div class="dropdown">
        <img src="../assets/emp-avatar.jpg"
             width="34"
             class="rounded-circle dropdown-toggle"
             data-bs-toggle="dropdown"
             alt="Employee avatar">

        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">My Profile</a></li>
          <li><a class="dropdown-item text-danger" href="#">Log Out</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- STYLES -->
  <style>
    .navbar-logo { width:32px;height:32px }
    .employee-navbar {
      height:64px;
      background:linear-gradient(90deg,#7c3aed,#9333ea);
      box-shadow:0 14px 40px rgba(17,24,39,.12)
    }
    .employee-navbar .nav-link,
    .employee-navbar .navbar-brand {
      color:#fff!important;
      font-weight:600;
    }
    .employee-navbar .nav-link.active {
      color:#fef3c7!important;
    }

    .emp-status {
      width:16px;height:16px;border-radius:50%;
      background:#ef4444;
      border:2px solid #fff;
      box-shadow:0 0 0 6px rgba(239,68,68,.14);
      transition:.2s;
    }
    .emp-status.active {
      background:#22c55e;
      box-shadow:0 0 0 6px rgba(34,197,94,.18);
    }

    .status-toggle {
      width:36px;height:36px;
      border-radius:12px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.12);
      cursor:pointer;
    }

    .status-menu { min-width:240px;padding:14px }
  </style>

  <!-- SCRIPT -->
  <script>
    (function () {
      const wrapper = document.currentScript.parentElement;

      // Active link highlight
      const current = location.pathname.split('/').pop();
      wrapper.querySelectorAll('.nav-link').forEach(l=>{
        if(l.getAttribute('href')===current) l.classList.add('active');
      });

      const dot = wrapper.querySelector('#empStatus');
      const inPanel = wrapper.querySelector('#empCheckInPanel');
      const outPanel = wrapper.querySelector('#empCheckOutPanel');
      const inBtn = wrapper.querySelector('#empCheckInBtn');
      const outBtn = wrapper.querySelector('#empCheckOutBtn');

      function setStatus(checkedIn){
        dot.classList.toggle('active',checkedIn);
        inPanel.classList.toggle('d-none',checkedIn);
        outPanel.classList.toggle('d-none',!checkedIn);
      }

      inBtn.onclick = () => setStatus(true);
      outBtn.onclick = () => setStatus(false);
    })();
  </script>
</div>
