<div class="employee-navbar-wrapper" id="employee-navbar">
  <nav class="navbar navbar-expand px-4 employee-navbar">
    <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
      <img src="../assets/logo.png" alt="Dayflow Logo" class="navbar-logo">
      <span class="fw-bold">Dayflow</span>
    </a>

    <ul class="navbar-nav ms-4">
      <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="attendance.html">Attendance</a></li>
      <li class="nav-item"><a class="nav-link" href="apply-leave.html">Time Off</a></li>
    </ul>

    <div class="ms-auto d-flex align-items-center gap-3">
      <div class="dropdown">
        <div id="employeeStatusToggle" class="status-toggle dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" title="Not Checked In">
          <div id="employeeStatus" class="employee-status"></div>
        </div>
        <div class="dropdown-menu dropdown-menu-end status-menu" aria-labelledby="employeeStatusToggle">
          <div id="checkInPanel">
            <h6 class="text-uppercase text-muted mb-2">Check In</h6>
            <label class="form-label mb-1" for="checkInTime">Pick time</label>
            <input type="time" class="form-control mb-2" id="checkInTime" aria-label="Check in time" readonly>
            <button class="btn btn-primary btn-sm" id="checkInBtn">Check In</button>
          </div>
          <div id="checkOutPanel" class="d-none">
            <h6 class="text-uppercase text-muted mb-2">Check Out</h6>
            <label class="form-label mb-1" for="checkOutTime">Pick time</label>
            <input type="time" class="form-control mb-2" id="checkOutTime" aria-label="Check out time" readonly>
            <button class="btn btn-outline-primary btn-sm" id="checkOutBtn">Check Out</button>
          </div>
        </div>
      </div>

      <div class="dropdown">
        <img src="../assets/01.jpg" width="34" class="rounded-circle dropdown-toggle" data-bs-toggle="dropdown" alt="Employee avatar">
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="profile.html">My Profile</a></li>
          <li><a class="dropdown-item text-danger" href="#">Log Out</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <style>
    .navbar-logo { width: 32px; height: 32px; object-fit: contain; }
    .employee-navbar { height: 64px; background: linear-gradient(90deg, #7c3aed, #9333ea); box-shadow: 0 14px 40px rgba(17, 24, 39, 0.12); }
    .employee-navbar .navbar-brand, .employee-navbar .nav-link { color: #ffffff !important; font-weight: 600; letter-spacing: 0.2px; }
    .employee-navbar .nav-link.active { color: #fef3c7 !important; }
    .employee-navbar .dropdown-toggle::after { display: none !important; }
    .employee-status { width: 16px; height: 16px; border-radius: 50%; background: #ef4444; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.14); transition: background 200ms ease, box-shadow 200ms ease; }
    .employee-status.active { background: #22c55e; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18); }
    .status-toggle { width: 36px; height: 36px; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.12); cursor: pointer; }
    .status-menu { min-width: 240px; padding: 14px; }
    .status-menu h6 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .status-menu .form-control { font-size: 13px; padding: 8px 10px; }
    .status-menu .btn { width: 100%; }
  </style>

  <script>
    (function () {
      var wrapper = document.currentScript.parentElement;
      var navLinks = wrapper.querySelectorAll('.nav-link');
      var currentPage = window.location.pathname.split('/').pop() || 'dashboard.html';
      navLinks.forEach(function (link) {
        if (link.getAttribute('href') === currentPage) {
          link.classList.add('active');
        }
      });

      var statusDot = wrapper.querySelector('#employeeStatus');
      var statusToggle = wrapper.querySelector('#employeeStatusToggle');
      var checkInPanel = wrapper.querySelector('#checkInPanel');
      var checkOutPanel = wrapper.querySelector('#checkOutPanel');
      var checkInBtn = wrapper.querySelector('#checkInBtn');
      var checkOutBtn = wrapper.querySelector('#checkOutBtn');
      var checkInTime = wrapper.querySelector('#checkInTime');
      var checkOutTime = wrapper.querySelector('#checkOutTime');
      var isCheckedIn = statusDot.classList.contains('active');
      var statusDropdown = new bootstrap.Dropdown(statusToggle, { autoClose: true });

      function currentTimeHHMM() {
        var now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      function setStatus(checkedIn) {
        isCheckedIn = checkedIn;
        statusDot.classList.toggle('active', checkedIn);
        statusToggle.title = checkedIn ? 'Checked In' : 'Not Checked In';
        checkInPanel.classList.toggle('d-none', checkedIn);
        checkOutPanel.classList.toggle('d-none', !checkedIn);
      }

      setStatus(isCheckedIn);

      statusToggle.addEventListener('show.bs.dropdown', function () {
        var now = currentTimeHHMM();
        if (isCheckedIn) {
          checkOutTime.value = now;
        } else {
          checkInTime.value = now;
        }
      });

      checkInBtn.addEventListener('click', function (e) {
        e.preventDefault();
        var time = currentTimeHHMM();
        console.log('Checked in at', time);
        setStatus(true);
        statusDropdown.hide();
      });

      checkOutBtn.addEventListener('click', function (e) {
        e.preventDefault();
        var time = currentTimeHHMM();
        console.log('Checked out at', time);
        setStatus(false);
        statusDropdown.hide();
      });
    })();
  </script>
</div>
