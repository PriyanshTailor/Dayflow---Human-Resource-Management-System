<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Attendance | Dayflow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #6b7280;
            --surface: #ffffff;
            --surface-soft: #f6f4fb;
            --accent: #7c3aed;
            --accent-2: #9333ea;
            --success: #22c55e;
            --warning: #eab308;
            --shadow: 0 14px 40px rgba(17, 24, 39, 0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--surface-soft);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
        }

        .page-shell { padding: 28px 32px 40px; }
        .page-card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: var(--shadow);
            padding: 22px 22px 8px;
        }

        .muted { color: var(--muted); }

        .control-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .date-switcher {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-selector {
            background: #f3e8ff;
            border: 1px solid #e9d5ff;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            color: #4c1d95;
            cursor: pointer;
            min-width: 140px;
            text-align: center;
        }

        .arrow-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            color: #111827;
            cursor: pointer;
        }

        .arrow-btn:hover { background: #f9fafb; }

        .summary-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 8px 0 16px;
        }

        .summary-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 14px;
            background: #faf5ff;
        }

        .summary-title { font-size: 13px; font-weight: 700; color: #5b21b6; margin-bottom: 4px; }
        .summary-value { font-size: 18px; font-weight: 800; color: #111827; }

        .date-header {
            background: #eef2ff;
            border: 1px solid #e0e7ff;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: 700;
            color: #312e81;
            text-align: center;
            margin-bottom: 16px;
        }

        table { font-size: 14px; }
        thead th { background: #f8fafc; font-weight: 700; color: #111827; }
        tbody td { vertical-align: middle; }

        @media (max-width: 768px) {
            .control-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div id="employee-navbar"></div>

<div class="page-shell">
    <div class="page-card">
        <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3">
            <div>
                <h4 class="mb-1">Attendance</h4>
                <p class="mb-0 muted">View your check-in, check-out, and working hours history.</p>
            </div>
        </div>

        <div class="control-bar">
            <div class="date-switcher">
                <button class="arrow-btn" id="prevMonth" aria-label="Previous month">&#8592;</button>
                <button class="arrow-btn" id="nextMonth" aria-label="Next month">&#8594;</button>
                <div class="month-selector" id="monthLabel">--</div>
            </div>
        </div>

        <div class="summary-row">
            <div class="summary-card">
                <div class="summary-title">Days Present</div>
                <div class="summary-value" id="daysPresent">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Leaves Count</div>
                <div class="summary-value" id="leavesCount">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Total Working Days</div>
                <div class="summary-value" id="workingDays">0</div>
            </div>
        </div>

        <div class="date-header" id="selectedDate">--</div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle mb-2" id="attendanceTable">
                <thead>
                    <tr>
                        <th style="width: 18%">Date</th>
                        <th style="width: 13%">Check In</th>
                        <th style="width: 13%">Check Out</th>
                        <th style="width: 13%">Work Hours</th>
                        <th style="width: 13%">Extra Hours</th>
                        <th style="width: 18%">Approval Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceBody">
                    <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = '/hrms/backend/employee/attendance.php';

function loadEmployeeNavbar() {
    const host = document.getElementById('employee-navbar');
    if (!host) return;
    fetch('navbar.html')
        .then(res => res.text())
        .then(html => {
            host.innerHTML = html;
            host.querySelectorAll('script').forEach(oldScript => {
                const s = document.createElement('script');
                if (oldScript.src) {
                    s.src = oldScript.src;
                } else {
                    s.textContent = oldScript.textContent;
                }
                host.appendChild(s);
            });
        })
        .catch(err => console.error('Failed to load navbar', err));
}

const state = {
    currentMonth: new Date().getMonth(),
    currentYear: new Date().getFullYear(),
    data: []
};

const monthLabel = document.getElementById('monthLabel');
const selectedDate = document.getElementById('selectedDate');

const api = async (url) => {
    const res = await fetch(url, { credentials: 'include' });
    if (res.status === 401) {
        window.location.href = '/hrms/frontend/auth/login.html';
        return null;
    }
    return res.json();
};

const getMonthParam = () => `${state.currentYear}-${(state.currentMonth + 1).toString().padStart(2, '0')}`;
const getMonthName = () => new Date(state.currentYear, state.currentMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
const fmtDate = (dateStr) => new Date(dateStr).toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
const fmtLongDate = (dateStr) => new Date(dateStr).toLocaleDateString(undefined, { day: '2-digit', month: 'long', year: 'numeric' });

async function loadAttendanceData() {
    const monthParam = getMonthParam();
    const data = await api(`${API_BASE}?action=daily&date=${monthParam}`);
    if (!data || !data.success) {
        renderTable([]);
        return;
    }
    state.data = (data.data || []).map(rec => ({
        date: rec.date,
        checkIn: rec.check_in_time,
        checkOut: rec.check_out_time,
        workingHours: rec.working_hours,
        approvalStatus: rec.approval_status
    }));
    renderTable(state.data);
}

async function loadMonthlySummary() {
    const monthParam = getMonthParam();
    const data = await api(`${API_BASE}?action=summary&month=${monthParam}`);
    if (!data || !data.success) return;
    const s = data.data || {};
    document.getElementById('daysPresent').textContent = s.present_days || 0;
    document.getElementById('leavesCount').textContent = s.leave_days || 0;
    document.getElementById('workingDays').textContent = s.total_days || 0;
}

function renderTable(rows) {
    monthLabel.textContent = getMonthName();
    const body = document.getElementById('attendanceBody');

    if (rows.length) {
        selectedDate.textContent = fmtLongDate(rows[0].date);
    } else {
        selectedDate.textContent = getMonthName();
    }

    if (!rows.length) {
        body.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No attendance records found for this month.</td></tr>';
        return;
    }

    body.innerHTML = '';
    rows.forEach(row => {
        const tr = document.createElement('tr');
        const extra = (() => {
            const hrs = parseFloat(row.workingHours || 0);
            if (!hrs || hrs <= 8) return '0.00';
            return `+${(hrs - 8).toFixed(2)}`;
        })();

        const statusBadge = (() => {
            const status = (row.approvalStatus || '').trim();
            if (status === 'Approved') return '<span class="badge bg-success">Approved</span>';
            if (status === 'Rejected') return '<span class="badge bg-danger">Rejected</span>';
            return '<span class="badge bg-warning text-dark">Pending</span>';
        })();

        tr.innerHTML = `
            <td>${fmtDate(row.date)}</td>
            <td>${row.checkIn || '-'}</td>
            <td>${row.checkOut || '-'}</td>
            <td>${row.workingHours ? Number(row.workingHours).toFixed(2) : '-'}</td>
            <td>${extra}</td>
            <td>${statusBadge}</td>
        `;
        body.appendChild(tr);
    });
}

document.getElementById('prevMonth').addEventListener('click', () => {
    if (state.currentMonth === 0) {
        state.currentMonth = 11;
        state.currentYear--;
    } else {
        state.currentMonth--;
    }
    loadAttendanceData();
    loadMonthlySummary();
});

document.getElementById('nextMonth').addEventListener('click', () => {
    if (state.currentMonth === 11) {
        state.currentMonth = 0;
        state.currentYear++;
    } else {
        state.currentMonth++;
    }
    loadAttendanceData();
    loadMonthlySummary();
});

document.addEventListener('DOMContentLoaded', () => {
    loadEmployeeNavbar();
    loadAttendanceData();
    loadMonthlySummary();
});
</script>

</body>
</html>
