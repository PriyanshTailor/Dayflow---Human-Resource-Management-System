<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Payroll | Dayflow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f6f4fb; color: #0f172a; }
        .page-shell { padding: 28px 32px 40px; }
        .page-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 14px 40px rgba(17,24,39,0.08); padding: 22px 22px 16px; }
        .muted { color: #6b7280; }
        .summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 12px 0 18px; }
        .summary-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; background: #f8fafc; }
        .summary-title { font-size: 13px; font-weight: 700; color: #5b21b6; margin-bottom: 4px; }
        .summary-value { font-size: 18px; font-weight: 800; color: #111827; }
        table { font-size: 14px; }
        thead th { background: #f8fafc; font-weight: 700; color: #111827; }
    </style>
</head>
<body>
<div id="employee-navbar"></div>

<div class="page-shell">
    <div class="page-card">
        <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 mb-3">
            <div>
                <h4 class="mb-1">Payroll</h4>
                <p class="mb-0 muted">See your monthly take-home based on approved attendance.</p>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <input type="month" id="monthPicker" class="form-control" style="width: 170px;">
                <button class="btn btn-primary" id="refreshBtn">Refresh</button>
            </div>
        </div>

        <div class="summary-row">
            <div class="summary-card">
                <div class="summary-title">Gross Salary</div>
                <div class="summary-value" id="grossSalary">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Attendance Deductions</div>
                <div class="summary-value" id="attendanceDed">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Base Deductions</div>
                <div class="summary-value" id="baseDed">-</div>
            </div>
            <div class="summary-card">
                <div class="summary-title">Net Payable</div>
                <div class="summary-value" id="netPayable">-</div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle mb-2">
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody id="payrollBody">
                    <tr><td colspan="2" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = '/hrms/backend/employee/payroll.php';

function loadEmployeeNavbar() {
    const host = document.getElementById('employee-navbar');
    if (!host) return;
    fetch('navbar.html')
        .then(res => res.text())
        .then(html => {
            host.innerHTML = html;
            host.querySelectorAll('script').forEach(oldScript => {
                const s = document.createElement('script');
                if (oldScript.src) s.src = oldScript.src; else s.textContent = oldScript.textContent;
                host.appendChild(s);
            });
        })
        .catch(err => console.error('Failed to load navbar', err));
}

const fmtCurrency = (val, currency) => {
    if (val === null || val === undefined || isNaN(val)) return '-';
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: currency || 'USD' }).format(val);
};

async function fetchPayroll(month) {
    const res = await fetch(`${API_BASE}?month=${month}`, { credentials: 'include' });
    if (res.status === 401) { window.location.href = '/hrms/frontend/auth/login.html'; return null; }
    return res.json();
}

function renderPayroll(data) {
    const currency = data.currency || 'USD';
    document.getElementById('grossSalary').textContent = fmtCurrency(data.gross_salary, currency);
    document.getElementById('attendanceDed').textContent = fmtCurrency(data.attendance_deductions, currency);
    document.getElementById('baseDed').textContent = fmtCurrency(data.base_deductions, currency);
    document.getElementById('netPayable').textContent = fmtCurrency(data.net_payable, currency);

    const body = document.getElementById('payrollBody');
    body.innerHTML = '';
    const rows = [
        ['Month', data.month],
        ['Currency', currency],
        ['Basic Salary', fmtCurrency(data.basic_salary, currency)],
        ['Allowances', fmtCurrency(data.allowances, currency)],
        ['Gross Salary', fmtCurrency(data.gross_salary, currency)],
        ['Daily Rate (30d)', fmtCurrency(data.daily_rate, currency)],
        ['Present Days', data.present_days],
        ['Leave Days (paid)', data.leave_days],
        ['Half Days (paid 0.5)', data.half_days],
        ['Absent Days (unpaid)', data.absent_days],
        ['Payable Days', data.payable_days],
        ['Attendance Deductions', fmtCurrency(data.attendance_deductions, currency)],
        ['Base Deductions', fmtCurrency(data.base_deductions, currency)],
        ['Net Payable', fmtCurrency(data.net_payable, currency)]
    ];
    rows.forEach(([k,v]) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${k}</td><td>${v ?? '-'}</td>`;
        body.appendChild(tr);
    });
}

async function loadPayroll() {
    const monthInput = document.getElementById('monthPicker');
    const monthVal = monthInput.value || new Date().toISOString().slice(0,7);
    monthInput.value = monthVal;
    const result = await fetchPayroll(monthVal);
    const body = document.getElementById('payrollBody');
    if (!result || !result.success) {
        body.innerHTML = '<tr><td colspan="2" class="text-center text-muted py-4">No payroll data available</td></tr>';
        return;
    }
    renderPayroll(result.data);
}

document.addEventListener('DOMContentLoaded', () => {
    loadEmployeeNavbar();
    const monthInput = document.getElementById('monthPicker');
    monthInput.value = new Date().toISOString().slice(0,7);
    document.getElementById('refreshBtn').addEventListener('click', loadPayroll);
    loadPayroll();
});
</script>
</body>
</html>
