<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Off | Dayflow</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --ink: #1e293b;
    --ink-light: #475569;
    --muted: #64748b;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --accent: #7c3aed;
    --accent-2: #9333ea;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
    --shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    --shadow-lg: 0 20px 40px rgba(15, 23, 42, 0.12);
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    color: var(--ink);
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.page-shell {
    padding: 32px;
    max-width: 1400px;
    margin: 0 auto;
}

.page-card {
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: var(--shadow-lg);
    padding: 32px;
    transition: box-shadow 0.3s ease;
}

.page-card:hover {
    box-shadow: 0 25px 50px rgba(15, 23, 42, 0.15);
}

.muted { color: var(--muted); }

/* Header */
.header-section {
    background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
    padding: 24px 28px;
    border-radius: 16px;
    margin-bottom: 28px;
    border: 1px solid #e9d5ff;
    box-shadow: var(--shadow-sm);
}

.header-section h4 {
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 4px;
    letter-spacing: -0.02em;
}

.header-section p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
}

/* Action Bar */
.action-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}

.btn-new {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    font-weight: 600;
    font-size: 14px;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    transition: all 0.2s ease;
    cursor: pointer;
}

.btn-new:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35);
    color: #ffffff;
}

.btn-new:active {
    transform: translateY(0);
}

/* Stats */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
}

.stat-card {
    background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
}

.stat-card h6 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
}

.stat-card .value {
    font-size: 36px;
    font-weight: 800;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 8px;
}

.stat-card .label {
    font-size: 13px;
    color: var(--ink-light);
    font-weight: 500;
}

.leave-type-paid {
    background: linear-gradient(135deg, #ede9fe 0%, #f3e8ff 100%);
    border-color: #e9d5ff;
}

.leave-type-sick {
    background: linear-gradient(135deg, #fef3c7 0%, #fef9c3 100%);
    border-color: #fde68a;
}

/* Table */
.table-responsive {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
}

table {
    font-size: 14px;
    margin: 0;
}

table thead th {
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 16px;
    border-bottom: 2px solid #e2e8f0;
}

table tbody tr {
    transition: all 0.2s ease;
    border-bottom: 1px solid #f1f5f9;
}

table tbody tr:hover {
    background: #fafafa;
}

table tbody td {
    vertical-align: middle;
    padding: 18px 16px;
    color: var(--ink-light);
}

table tbody td:first-child {
    font-weight: 600;
    color: var(--ink);
}

.status-badge {
    padding: 6px 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
    border: 1px solid #fde68a;
}

.status-approved {
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #a7f3d0;
}

.status-rejected {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
}

/* Modal */
.modal-backdrop {
    backdrop-filter: blur(8px);
    background-color: rgba(15, 23, 42, 0.6) !important;
}

.modal-content {
    border-radius: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
}

.modal-header {
    background: linear-gradient(135deg, #faf5ff 0%, #f3e8ff 100%);
    border-bottom: 1px solid #e9d5ff;
    border-radius: 20px 20px 0 0;
    padding: 20px 24px;
}

.modal-header .modal-title {
    font-weight: 700;
    color: var(--ink);
    font-size: 20px;
}

.modal-header .btn-close {
    background: transparent;
    opacity: 0.6;
}

.modal-header .btn-close:hover {
    opacity: 1;
}

.modal-body {
    padding: 28px 24px;
}

.modal-footer {
    padding: 20px 24px;
    border-top: 1px solid #f1f5f9;
}

.form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
}

.form-control, .form-select {
    border-radius: 10px;
    border: 2px solid #e2e8f0;
    padding: 10px 14px;
    font-size: 14px;
    transition: all 0.2s ease;
}

.form-control:focus, .form-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
}

.info-note {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #1e40af;
    margin-top: 12px;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}
</style>
</head>
<body>

<div id="employee-navbar"></div>

<div class="page-shell">
    <div class="page-card">
        <!-- <div class="header-section">
            <h4>Time Off</h4>
            <p>Manage your leave requests and view your available leave balance.</p>
        </div> -->

        <div class="action-bar">
            <button class="btn btn-new" data-bs-toggle="modal" data-bs-target="#applyLeaveModal">
                + Apply for Leave
            </button>
        </div>

        <div class="stats-row">
            <div class="stat-card leave-type-paid">
                <h6>Paid Time Off</h6>
                <div class="value">24</div>
                <div class="label">Days Available</div>
            </div>
            <div class="stat-card leave-type-sick">
                <h6>Sick Time Off</h6>
                <div class="value">07</div>
                <div class="label">Days Available</div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered align-middle mb-0" id="leaveTable">
                <thead>
                    <tr>
                        <th style="width: 20%">Name</th>
                        <th style="width: 15%">Start Date</th>
                        <th style="width: 15%">End Date</th>
                        <th style="width: 20%">Time Off Type</th>
                        <th style="width: 15%">Status</th>
                    </tr>
                </thead>
                <tbody id="leaveBody">
                    <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Apply Leave Modal -->
<div class="modal fade" id="applyLeaveModal" tabindex="-1" aria-labelledby="applyLeaveModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="applyLeaveModalLabel">Time off Type Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="leaveForm">
                    <div class="mb-3">
                        <label class="form-label">Employee</label>
                        <input type="text" class="form-control" value="John Doe (EMP101)" disabled>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Time off Type</label>
                        <select class="form-select" id="leaveType" required>
                            <option value="">Select type</option>
                            <option value="paid">Paid Time Off</option>
                            <option value="sick">Sick Leave</option>
                            <option value="unpaid">Unpaid Leave</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Validity Period</label>
                        <div class="row g-2">
                            <div class="col">
                                <input type="date" class="form-control" id="startDate" required>
                            </div>
                            <div class="col-auto d-flex align-items-center">
                                <span class="text-muted">To</span>
                            </div>
                            <div class="col">
                                <input type="date" class="form-control" id="endDate" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Allocation</label>
                        <div class="row g-2">
                            <div class="col">
                                <input type="number" class="form-control" id="leaveDays" min="0.5" step="0.5" value="1" readonly>
                            </div>
                            <div class="col-auto d-flex align-items-center">
                                <span class="text-muted">Days</span>
                            </div>
                        </div>
                        <div class="info-note">
                            📅 Number of days will be calculated automatically based on the date range.
                        </div>
                    </div>

                    <div class="mb-3" id="attachmentSection" style="display: none;">
                        <label class="form-label">Attachment</label>
                        <input type="file" class="form-control" id="attachment" accept=".pdf,.jpg,.jpeg,.png">
                        <small class="text-muted">For sick leave certificate</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Reason (Optional)</label>
                        <textarea class="form-control" id="reason" rows="3" placeholder="Please provide a reason for your leave request..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitLeave()">Submit</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = '/hrms/backend';
    let leaveData = [];

    function loadEmployeeNavbar() {
        var host = document.getElementById('employee-navbar');
        if (!host) return;
        fetch('navbar.html')
            .then(function (res) { return res.text(); })
            .then(function (html) {
                host.innerHTML = html;
                // execute inline scripts inside the loaded navbar
                host.querySelectorAll('script').forEach(function (oldScript) {
                    var newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    host.appendChild(newScript);
                });
            })
            .catch(function (err) { console.error('Failed to load navbar', err); });
    }

    // Load leave requests from database
    async function loadLeaveData() {
        try {
            const response = await fetch(API_BASE + '/employee/leave.php', {
                credentials: 'include'
            });
            
            if (response.status === 401) {
                window.location.href = '/hrms/frontend/auth/login.html';
                return;
            }
            
            const data = await response.json();
            
            if (data.success) {
                leaveData = data.data || [];
                renderLeaveTable();
            }
        } catch (error) {
            console.error('Error loading leave data:', error);
        }
    }

    function formatDate(dateStr) {
        var d = new Date(dateStr);
        return d.toLocaleDateString(undefined, { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function renderLeaveTable() {
        var body = document.getElementById('leaveBody');
        
        if (!leaveData.length) {
            body.innerHTML = '<tr><td colspan="5" class="empty-state">No leave requests found.</td></tr>';
            return;
        }

        body.innerHTML = '';
        
        // Sort by start date (newest first)
        var sortedData = leaveData.sort(function(a, b) {
            return new Date(b.start_date) - new Date(a.start_date);
        });

        sortedData.forEach(function (leave) {
            var tr = document.createElement('tr');
            var statusClass = 'status-' + leave.status.toLowerCase();
            var statusLabel = leave.status.charAt(0).toUpperCase() + leave.status.slice(1);

            tr.innerHTML = '' +
                '<td>' + (leave.employee_name || '-') + '</td>' +
                '<td>' + formatDate(leave.start_date) + '</td>' +
                '<td>' + formatDate(leave.end_date) + '</td>' +
                '<td>' + leave.leave_type + '</td>' +
                '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>';
            body.appendChild(tr);
        });
    }

    // Show/hide attachment field based on leave type
    document.addEventListener('DOMContentLoaded', function() {
        loadEmployeeNavbar();
        loadLeaveData();
        
        document.getElementById('leaveType').addEventListener('change', function() {
            var attachmentSection = document.getElementById('attachmentSection');
            if (this.value === 'sick') {
                attachmentSection.style.display = 'block';
            } else {
                attachmentSection.style.display = 'none';
            }
        });
        
        document.getElementById('startDate').addEventListener('change', calculateDays);
        document.getElementById('endDate').addEventListener('change', calculateDays);
    });

    // Calculate days when dates change
    function calculateDays() {
        var startDate = document.getElementById('startDate').value;
        var endDate = document.getElementById('endDate').value;
        
        if (startDate && endDate) {
            var start = new Date(startDate);
            var end = new Date(endDate);
            
            if (end >= start) {
                var diffTime = Math.abs(end - start);
                var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('leaveDays').value = diffDays;
            }
        }
    }

    // Submit leave request to backend
    async function submitLeave() {
        var leaveType = document.getElementById('leaveType').value;
        var startDate = document.getElementById('startDate').value;
        var endDate = document.getElementById('endDate').value;
        var leaveDays = document.getElementById('leaveDays').value;
        var reason = document.getElementById('reason').value;

        var leaveTypeMapped = {
            'paid': 'Paid',
            'sick': 'Sick',
            'unpaid': 'Unpaid'
        }[leaveType];

        if (!leaveTypeMapped || !startDate || !endDate) {
            alert('Please fill all required fields');
            return;
        }

        var start = new Date(startDate);
        var end = new Date(endDate);
        
        if (end < start) {
            alert('End date cannot be before start date');
            return;
        }

        try {
            const response = await fetch(API_BASE + '/employee/leave.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({
                    leave_type: leaveTypeMapped,
                    start_date: startDate,
                    end_date: endDate,
                    reason: reason
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert('Leave request submitted successfully!');
                
                // Close modal and reset form
                var modal = bootstrap.Modal.getInstance(document.getElementById('applyLeaveModal'));
                modal.hide();
                document.getElementById('leaveForm').reset();
                document.getElementById('attachmentSection').style.display = 'none';
                
                // Reload leave data
                loadLeaveData();
            } else {
                alert(data.message || 'Failed to submit leave request');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Failed to submit leave request');
        }
    }
</script>

</body>
</html>
